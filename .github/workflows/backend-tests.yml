
name: Backend CI

on:
  push:
    branches: [main, jiya]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codemafia
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: codemafia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U codemafia -d codemafia_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CODEMAFIA_DATABASE_URL: postgresql://codemafia:ci-only-password@localhost:5432/codemafia_test
      CODEMAFIA_TEST_DATABASE_URL: postgresql://codemafia:ci-only-password@localhost:5432/codemafia_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Check Python style
        run: |
          python -m ruff check backend
          python -m ruff format --check backend

      - name: Verify database setup
        run: |
          python -m backend.app.db migrate up
          python -m backend.app.db seed
          python -m backend.app.db check

      - name: Run backend tests
        run: python -m pytest backend/tests -q
